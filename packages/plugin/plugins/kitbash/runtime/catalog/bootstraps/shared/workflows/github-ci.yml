name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install the Rust toolchain when this is a Rust project
        if: hashFiles('Cargo.toml') != ''
        run: rustup show
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Rehearse migrations and dry-run Worker deployments without credentials
        if: hashFiles('wrangler.jsonc', 'wrangler.json', 'wrangler.toml') != ''
        run: pnpm ci:dry-run
      - run: pnpm smoke
