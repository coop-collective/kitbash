name: Deploy Worker
on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production]
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/worker-ci.yml
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: worker-deploy-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch deployment credentials with OIDC
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT_SLUG || inputs.target }}
          secret-path: /ci
          include-imports: 'false'
          recursive: 'false'
      - name: Fetch application secrets
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT_SLUG || inputs.target }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH || '/app' }}
          include-imports: 'false'
          recursive: 'false'
      - name: Apply migrations then deploy the checked commit
        env:
          TARGET: ${{ inputs.target }}
        run: node scripts/deploy.mjs "$TARGET" --execute
