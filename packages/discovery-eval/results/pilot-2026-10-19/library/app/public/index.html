<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Sink</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:0 auto;padding:1rem;color:#222}
section{border:1px solid #ccc;border-radius:8px;padding:1rem;margin:1rem 0}
label{display:block;margin:.5rem 0 .2rem;font-weight:600}
input,textarea{width:100%;box-sizing:border-box;padding:.5rem;font:inherit}
input[type=checkbox]{width:auto}
button{padding:.5rem 1rem;margin-top:.7rem;font:inherit}
[hidden]{display:none!important}
.status{color:#065;min-height:1.5em}
</style></head><body>
<h1>Kitchen Sink</h1>
<section id="login-panel">
  <h2>Sign in</h2>
  <form id="login-form">
    <label for="login-email">Email</label>
    <input id="login-email" data-testid="login-email" type="email" autocomplete="username">
    <label for="login-password">Password</label>
    <input id="login-password" data-testid="login-password" type="password" autocomplete="current-password">
    <button type="submit" data-testid="login-submit">Sign in</button>
    <div id="login-status" class="status" role="alert"></div>
  </form>
</section>
<div id="app" hidden>
  <p>Signed in as <strong id="who"></strong>
    <button type="button" data-testid="logout" id="logout">Log out</button></p>
  <section>
    <h2>Profile</h2>
    <form id="profile-form">
      <label for="profile-handle">Handle</label>
      <input id="profile-handle" data-testid="profile-handle" maxlength="30">
      <label for="profile-display-name">Display name</label>
      <input id="profile-display-name" data-testid="profile-display-name" maxlength="80">
      <label for="profile-bio">Bio</label>
      <textarea id="profile-bio" data-testid="profile-bio" rows="3" maxlength="500"></textarea>
      <button type="submit" data-testid="profile-save">Save profile</button>
      <div class="status" data-testid="profile-status" role="status"></div>
    </form>
  </section>
  <section>
    <h2>Private file</h2>
    <label for="upload-file">File (max 1 MiB)</label>
    <input id="upload-file" data-testid="upload-file" type="file">
    <button type="button" data-testid="upload-submit" id="upload-submit">Upload</button>
    <div class="status" id="upload-status" role="status"></div>
    <a data-testid="upload-download" id="upload-download" hidden download>Download last upload</a>
  </section>
  <section>
    <h2>Report</h2>
    <button type="button" data-testid="report-refresh" id="report-refresh">Refresh report</button>
    <div class="status" data-testid="report-status" role="status"></div>
  </section>
</div>
<script>
const $ = s => document.querySelector(s), t = id => document.querySelector(`[data-testid="${id}"]`);
let revision = 0;
const api = (path, opts = {}) => fetch(path, { credentials: 'same-origin', ...opts });
const post = (path, body, type) => api(path, { method: 'POST', body, headers: type ? { 'Content-Type': type } : {} });

function show(user) {
  $('#login-panel').hidden = !!user;
  $('#app').hidden = !user;
  $('#who').textContent = user ? user.email : '';
  if (!user) {
    t('profile-status').textContent = ''; t('report-status').textContent = '';
    $('#upload-status').textContent = ''; $('#upload-download').hidden = true; $('#upload-download').removeAttribute('href');
    t('login-password').value = '';
  }
}
async function loadProfile() {
  const r = await api('/api/profile');
  if (!r.ok) return;
  const d = await r.json();
  revision = d.revision;
  t('profile-handle').value = d.profile.handle;
  t('profile-display-name').value = d.profile.display_name;
  t('profile-bio').value = d.profile.bio;
}
async function init() {
  const r = await api('/api/session');
  if (r.ok) { show((await r.json()).user); await loadProfile(); } else show(null);
}
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await post('/api/login', JSON.stringify({ email: t('login-email').value, password: t('login-password').value }), 'application/json');
  if (!r.ok) { $('#login-status').textContent = 'Login failed'; return; }
  $('#login-status').textContent = '';
  show((await r.json()).user); await loadProfile();
});
$('#logout').addEventListener('click', async () => { await post('/api/logout'); show(null); });
$('#profile-form').addEventListener('submit', async e => {
  e.preventDefault();
  const st = t('profile-status');
  const r = await api('/api/profile', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
    handle: t('profile-handle').value, display_name: t('profile-display-name').value, bio: t('profile-bio').value,
    avatar_id: null, is_public: false, revision }) });
  if (r.ok) { const d = await r.json(); revision = d.revision; st.textContent = `Saved (revision ${d.revision})`; }
  else if (r.status === 409) { st.textContent = 'Conflict: profile changed elsewhere or handle taken; reloaded.'; await loadProfile(); }
  else st.textContent = 'Save failed: check handle (3-30 lowercase letters, digits, _) and name.';
});
$('#upload-submit').addEventListener('click', async () => {
  const f = t('upload-file').files[0], st = $('#upload-status');
  if (!f) { st.textContent = 'Choose a file first.'; return; }
  const r = await post('/api/uploads', f, 'application/octet-stream');
  if (!r.ok) { st.textContent = r.status === 413 ? 'File too large (max 1 MiB).' : 'Upload failed.'; return; }
  const { id } = await r.json();
  const a = $('#upload-download');
  a.href = `/api/uploads/${id}`; a.setAttribute('download', f.name); a.hidden = false;
  st.textContent = 'Uploaded.';
});
$('#report-refresh').addEventListener('click', async () => {
  const r = await api('/api/report'), st = t('report-status');
  if (!r.ok) { st.textContent = 'Report failed.'; return; }
  const d = await r.json();
  st.textContent = `${d.displayName} — revision ${d.revision} (${d.cacheTier})`;
});
init();
</script></body></html>
