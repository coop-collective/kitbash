<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Sink</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f5f5f7; color: #1d1d1f; }
  main { max-width: 640px; margin: 0 auto; padding: 1rem; }
  section { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  label { display: block; margin: .5rem 0 .2rem; font-weight: 600; }
  input[type=text], input[type=email], input[type=password], textarea { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; }
  button { margin-top: .75rem; padding: .5rem 1rem; font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .status { min-height: 1.5em; color: #555; }
</style>
</head>
<body>
<main>
  <h1>Kitchen Sink</h1>

  <section id="login-section">
    <h2>Sign in</h2>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" data-testid="login-email" type="email" autocomplete="username" value="alice@example.test">
      <label for="login-password">Password</label>
      <input id="login-password" data-testid="login-password" type="password" autocomplete="current-password">
      <button type="submit" data-testid="login-submit">Sign in</button>
      <p id="login-status" class="status" role="alert"></p>
    </form>
  </section>

  <div id="app-section" hidden>
    <p>Signed in as <strong id="whoami"></strong></p>

    <section>
      <h2>Profile</h2>
      <form id="profile-form">
        <label for="profile-handle">Handle</label>
        <input id="profile-handle" data-testid="profile-handle" type="text" maxlength="30">
        <label for="profile-display-name">Display name</label>
        <input id="profile-display-name" data-testid="profile-display-name" type="text" maxlength="80">
        <label for="profile-bio">Bio</label>
        <textarea id="profile-bio" data-testid="profile-bio" rows="3" maxlength="500"></textarea>
        <button type="submit" data-testid="profile-save">Save profile</button>
        <p class="status" data-testid="profile-status" role="status"></p>
      </form>
    </section>

    <section>
      <h2>Private file</h2>
      <form id="upload-form">
        <label for="upload-file">File (max 1 MiB)</label>
        <input id="upload-file" data-testid="upload-file" type="file">
        <button type="submit" data-testid="upload-submit">Upload</button>
        <p class="status" id="upload-status" role="status"></p>
        <a id="upload-download" data-testid="upload-download" hidden>Download last upload</a>
      </form>
    </section>

    <section>
      <h2>Report</h2>
      <button type="button" data-testid="report-refresh">Refresh report</button>
      <p class="status" data-testid="report-status" role="status"></p>
    </section>

    <button type="button" data-testid="logout">Log out</button>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
