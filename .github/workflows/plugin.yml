name: Plugin distribution
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test shipped payload before rebuilding
        run: node --test packages/plugin/test/distribution.test.mjs
      - run: pnpm --filter @w3bstack/plugin validate
      - run: pnpm --filter @w3bstack/plugin build
      - name: Require up-to-date committed bundle and catalog
        run: |
          git diff --exit-code -- packages/plugin/plugins/w3bstack/runtime
          test -z "$(git ls-files --others --exclude-standard packages/plugin/plugins/w3bstack/runtime)"
      - run: pnpm --filter @w3bstack/plugin test
  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @w3bstack/secrets-broker typecheck
      - run: pnpm --filter @w3bstack/secrets-broker test
      - run: pnpm --filter @w3bstack/secrets-broker test:worker
