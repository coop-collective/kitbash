# Root workspace. templates/* are deliberately NOT members: each template is its own pnpm root
# (installed with `pnpm install --ignore-workspace`), see templates/hono-d1/pnpm-workspace.yaml.
packages:
  - packages/*
  - test-e2e
# esbuild/workerd fetch their platform binaries in postinstall (wrangler, vitest-pool-workers: packages/api).
allowBuilds:
  esbuild: true
  workerd: true
  core-js-pure: false
