# One install and task map for the registry, runtime block payloads, fixtures, and recipes.
packages:
  - packages/*
  - blocks/*/variants/*/container
  - test-e2e/fixtures/*
  - recipes/*
  - docs/examples
  - test-e2e

# pnpm 12 resolves/vendors Cargo dependencies; Cargo.lock stays authoritative.
cargo:
  enabled: true

# Workerd/esbuild need their platform binaries for local Worker checks.
allowBuilds:
  esbuild: true
  workerd: true
  core-js-pure: false
